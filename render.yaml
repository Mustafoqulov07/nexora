services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: PAYMENT_PROVIDER_URL
        sync: false
      - key: PAYMENT_SHOP_ID
        sync: false
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.18.0

databases:
  - name: nexora-db
    plan: free
    region: frankfurt
